services:
  # Option A: Fullstack Unified Web Service (Recommended for Free Tier - 1 Service for both UI & API)
  - type: web
    name: ai-career-copilot
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
